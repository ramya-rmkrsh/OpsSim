global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'opssim-services'
    static_configs:
      - targets: ['service-a:8000', 'service-b:9100', 'service-c:9100']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']