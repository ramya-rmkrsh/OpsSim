server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container

      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

      - source_labels:  
          - __meta_docker_container_name
        target_label: container

    pipeline_stages:
      - docker: {}

      - json:
          #source: log
          expressions:
            service: service
            state: state
            trace_id: trace_id
            level: level
            request_id: request_id
            component: component
            operation: operation

      - labels:
          service:
          state:
          trace_id:
          level:
          request_id:
          component: